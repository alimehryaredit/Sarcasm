<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film Title – A short film by Ali Mehryar</title>
<meta name="description" content="Official website of the short film by Ali Mehryar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,800;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Cinemair";src:url("assets/fonts/Cinemair-DORLD.ttf") format("truetype");font-display:swap}
:root{--bg:#161616;--ink:#f1f0ec;--mute:#9b9a96;--line:#3a3a38;--serif:"Playfair Display",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.1,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:300 15px/1.75 var(--sans);overflow-x:hidden}
a{color:inherit}:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{max-width:1240px;margin:auto}
section{padding:clamp(70px,11vw,140px) clamp(16px,4vw,48px)}
h2{font:800 clamp(28px,4vw,46px)/1.1 var(--serif);margin-bottom:34px}

/* nav (same as portfolio) */
nav{position:fixed;inset:0 0 auto;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px clamp(16px,4vw,48px);transition:background .4s,backdrop-filter .4s}
nav.solid{background:rgba(22,22,22,.78);backdrop-filter:blur(10px)}
.logo{font:italic 500 19px var(--serif);text-decoration:none;justify-self:start}
.links{display:flex;gap:clamp(12px,2.4vw,30px);align-items:center;font-size:19px}
.links a{text-decoration:none;position:relative;padding:2px 0}
.links a:not(.cta)::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.links a:not(.cta):hover::after,.links a.on::after{transform:scaleX(1);transform-origin:left}
.cta{justify-self:end;text-decoration:none;background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:12px;font-size:19px;line-height:1.4;font-weight:600;transition:transform .3s var(--ease)}.cta:hover{transform:translateY(-2px)}
@media(max-width:700px){.links a:not(.cta){display:none}}
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;z-index:30}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:90px 16px;background:radial-gradient(circle at 30% 30%,#3a3a3a,#161616 70%)}
.hero .bg{position:absolute;inset:-8% 0;filter:grayscale(1) brightness(.5)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,var(--bg))}
.hero-in{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.pre{font:500 clamp(10px,1.2vw,13px) var(--serif);letter-spacing:.5em;padding-left:.5em;margin-bottom:14px;opacity:0;animation:fade 1.2s .2s forwards}
.hero h1{font:400 clamp(44px,11vw,160px)/1 "Cinemair",var(--serif);letter-spacing:.12em;padding-left:.12em}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(60%) rotate(4deg);animation:up 1s var(--ease) forwards;animation-delay:calc(var(--i)*55ms + 400ms)}
.hero .logotype{width:clamp(260px,52vw,720px);height:auto;margin:auto;opacity:0;transform:translateY(24px);animation:up 1.4s .5s var(--ease) forwards}
.hero .tl{font:italic 500 clamp(15px,2vw,24px) var(--serif);margin-top:18px;opacity:0;animation:fade 1.4s 1.5s forwards}
.scroll{position:absolute;bottom:26px;left:50%;z-index:2;width:1px;height:46px;background:var(--line);overflow:hidden}
.scroll::after{content:"";display:block;width:1px;height:50%;background:var(--ink);animation:drip 1.8s infinite}
@keyframes up{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes drip{from{transform:translateY(-100%)}to{transform:translateY(200%)}}


/* cards: every image slot shows a dashed placeholder until the file exists */
.card{position:relative;display:block;overflow:hidden;background:linear-gradient(160deg,#2c2c2c,#1a1a1a);border:0;padding:0;color:inherit}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:10px;display:grid;place-content:center;gap:4px;text-align:center;border:1px dashed var(--line);color:var(--mute);font-size:16px;letter-spacing:.06em;pointer-events:none}
.ph b{font:500 15px var(--serif);color:var(--ink);letter-spacing:0}
.lbl{margin-top:10px;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* centered titles */
#Trailer h2,#gallery h2,#Crew h2{text-align:center}
.poster .lbl,.vgrid .lbl{text-align:center}

/* story: text + framed poster */
.story{display:grid;grid-template-columns:1fr minmax(220px,340px);gap:clamp(24px,5vw,70px);align-items:center}
.story p{max-width:56ch;color:#cfcdc7;margin-bottom:1em}
.story h2{margin-bottom:10px}
.story .lg{font:400 clamp(18px,2.2vw,26px)/1.5 var(--serif);color:var(--ink);max-width:36ch;margin-bottom:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:26px;font-size:16px;color:var(--mute)}.meta b{color:var(--ink);font-weight:600}
.frame{aspect-ratio:2/3;border:1px solid var(--ink);padding:6px;background:#222}
.frame .card{width:100%;height:100%;cursor:zoom-in}
.frame img{transition:transform 1.2s var(--ease)}.frame:hover img{transform:scale(1.05)}
.poster figure{margin:0}
@media(max-width:760px){.story{grid-template-columns:1fr}.frame{max-width:280px}}

/* Trailer */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px}.vgrid figure{margin:0}
.player{position:relative;aspect-ratio:16/9;background:#0d0d0d;overflow:hidden}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;cursor:pointer;padding:0}.play .ph{place-content:end center;padding-bottom:18px}
.play img{filter:brightness(.55);transition:transform 1.2s var(--ease),filter .5s}.play:hover img{transform:scale(1.04);filter:brightness(.4)}
.play i{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--ease)}
.play:hover i{transform:scale(1.12)}.play i::before{content:"";margin-left:5px;border:11px solid transparent;border-left:18px solid var(--ink);border-right:0}

/* festivals */
.fest{list-style:none;padding:0}
.fest li{display:grid;grid-template-columns:70px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline;transition:padding .4s var(--ease)}
.fest li:hover{padding-left:10px}.fest .y{color:var(--mute);font-size:16px}.fest .n{font:700 17px var(--serif)}
.fest small{display:block;font:300 13px var(--sans);color:var(--mute)}.fest .r{font-size:16px;text-align:right}
.fest .win .r{font-weight:600;border:1px solid var(--ink);padding:3px 12px;border-radius:30px}
@media(max-width:600px){.fest li{grid-template-columns:50px 1fr}.fest .r{grid-column:2;text-align:left}}

/* gallery: same clip reveal as portfolio work cards */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.gal{grid-template-columns:repeat(2,1fr)}}
.gal button{position:relative;padding:0;border:0;background:linear-gradient(160deg,#333,#1b1b1b);aspect-ratio:16/9;overflow:hidden;cursor:zoom-in;clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease);transition-delay:calc(var(--i)*90ms)}
.gal.in button{clip-path:inset(0)}
.gal img{transform:scale(1.25);transition:transform 1.4s var(--ease),filter .6s}.gal.in img{transform:scale(1)}
.gal button:hover img{transform:scale(1.07);filter:brightness(.6)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.94);display:none;place-items:center}
#lb.on{display:grid}#lb img{width:auto;height:auto;max-width:92vw;max-height:88vh;object-fit:contain}
#lb button{position:absolute;background:none;border:0;color:var(--ink);font:300 34px var(--sans);cursor:pointer;padding:16px}
#lb .x{top:6px;right:10px}#lb .p{left:8px;top:50%}#lb .n{right:8px;top:50%}

/* Crew: circular photo slots */
.Crew{display:grid;grid-template-columns:repeat(4,1fr);gap:46px 30px;text-align:center}
@media(max-width:900px){.Crew{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.Crew{grid-template-columns:1fr}}
.Crew article{opacity:0;transform:translateY(24px);transition:.9s var(--ease);transition-delay:calc(var(--i)*70ms)}.Crew article.in{opacity:1;transform:none}
.av{position:relative;width:112px;height:112px;margin:0 auto 18px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#222;border:1px dashed var(--mute);font:500 28px var(--serif);color:var(--mute);transition:transform .6s var(--ease),border-color .4s}
.av.has{border:1px solid var(--ink)}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.Crew article:hover .av{transform:scale(1.07);border-color:var(--ink)}
.Crew h4{font:700 16px var(--serif);display:inline-block;padding-bottom:4px;background:linear-gradient(var(--ink),var(--ink)) center bottom/30% 2px no-repeat;transition:background-size .6s var(--ease)}
.Crew article:hover h4{background-size:100% 2px}.Crew p{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:2px;line-height:1.5}

/* end */
.end{text-align:center;padding-bottom:60px}
.tag{font:500 clamp(22px,4vw,44px)/1.3 var(--serif);letter-spacing:.03em}
.tag span{display:inline-block;opacity:0;transform:translateY(40%);transition:.9s var(--ease);transition-delay:calc(var(--i)*140ms)}.tag.in span{opacity:1;transform:none}
.tag .em{font-weight:800}
.social{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:50px auto 14px;font-size:16px}
.social a{display:inline-flex;align-items:center;gap:9px;padding:12px;line-height:1;text-decoration:none;color:var(--mute);border:1px solid var(--line);transition:color .3s,border-color .3s,transform .3s}
.social a:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-2px)}
.social svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.social .social-label{color:var(--ink);font-weight:600}
footer small{color:var(--mute);font-size:12px}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.pre,.hero h1 span,.hero .tl,.Crew article,.tag span{opacity:1!important;transform:none!important}.gal button{clip-path:inset(0)!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="bar"></div>
<nav id="nav"><a class="logo" href="#home" id="logo"></a><div class="links" id="links"></div><a class="cta" href="#contact">Contact</a></nav>
<div id="app"></div>
<div id="lb" role="dialog" aria-label="Image viewer"><button class="x" aria-label="Close">×</button><button class="p" aria-label="Previous">‹</button><img alt=""><button class="n" aria-label="Next">›</button></div>

<script>
/* =====================  EDIT YOUR FILM HERE  =====================
   Images go in assets/ next to this file. Empty sections hide themselves.
   Video: type "youtube" | "vimeo" | "file"; id = video id (vimeo private videos also need h = hash), src = mp4 path. */
const FILM = {
  title: "SARCASM",
  pre: "A SHORT FILM BY ALI MEHRYAR",
  tagline: "Some News Doesn’t Break You. It Sets You Free",
  closing: "Some News Doesn’t Break You. It Sets You *Free*",     // *word* = bold
  year: 2026, runtime: "10 min", genre: "", language: "Persian", country: "Iran",
  logotype: "",   // image logotype disabled so the title uses the Cinemair font; set a path to use an image instead
  backdrop: "assets/backdrop.jpg",
  poster: "assets/poster.jpg",
  logline: "A Young Woman Trapped In The Monotony Of Her Daily Routine Is Suddenly Pulled Out Of It By a Piece Of News That Changes Everything.",
  synopsis: [],
  videos: [
    { label: "Trailer", type: "vimeo", id: "1239216847", h: "ed071b60e4", cover: "assets/trailer-cover.jpg" }
  ],
  festivals: [
    { year: 2027, name: "Persian Film Awards 2027", result: "Official Selection" }
  ],
  /* [role, name, optional photo path]. Default photo = assets/Crew/<name-with-dashes>.jpg
     e.g. assets/Crew/dorsa-hakim-elahi.jpg  — drop the file in and it appears in the circle. */
  Crew: [
    ["Director", "Ali Mehryar"],
    ["Cast", "Dorsa Hakim Elahi"],
    ["Producer", "Hooman Sedaghi"],
    ["Producer", "Mehran Zolfaghari"],
    ["Director of Photography", "Morteza Hakakian"],
    ["Editor", "Morteza Souri"],
    ["Set & Costume Designer", "Rastegar Mohammadi"],
    ["Sound Recordist, Sound Design & Mixing", "Ehsan Salempour"],
    ["Makeup Artist", "Hamila Sedaghi"],
    ["Music Composer", "Mobin Salempour"],
    ["Color Correction & Grading", "Mehran Jebely"],
    ["Visual Effects (VFX)", "Sina Pashami"]
  ],
  gallery: Array.from({length:12},(_,i)=>`assets/bts-${i+1}.jpg`),   // 12 cards: bts-1.jpg … bts-12.jpg (change 12 to any number)
  contact: [["Portfolio","https://alimehryaredit.github.io/portfolio/","portfolio"],["Instagram","https://instagram.com/alimehryar","instagram"],["Email","mailto:Alimehryaredit@gmail.com","email"]]
};

/* =====================  BUILD  ===================== */
const ICON={
  portfolio:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/></svg>`,
  instagram:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".7" fill="currentColor" stroke="none"/></svg>`,
  email:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>`
};
const F=FILM,$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const vids=F.videos||[],fests=F.festivals||[],Crew=(F.Crew||[]).filter(c=>c[1]),gal=F.gallery||[];
const has={story:F.logline||(F.synopsis||[]).length,Trailer:vids.length,fest:fests.length,gal:gal.length,Crew:Crew.length};
document.title=`${F.title} – ${F.pre.toLowerCase().replace(/^./,c=>c.toUpperCase())}`;
$("#logo").textContent=F.title.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),ini=s=>s.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const nav=[["home","Home"],has.story&&["story","Story"],has.Trailer&&["Trailer","Trailer"],has.fest&&["festivals","Festivals"],has.gal&&["gallery","Gallery"],has.Crew&&["Crew","Crew"]].filter(Boolean);
$("#links").innerHTML=nav.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("");
const meta=[["Year",F.year],["Runtime",F.runtime],["Genre",F.genre],["Language",F.language],["Country",F.country]].filter(m=>m[1]);
const chars=s=>[...s].map((c,i)=>c==" "?" ":`<span style="--i:${i}">${c}</span>`).join("");
const words=s=>s.split(" ").map((w,i)=>w[0]=="*"?`<span class="em" style="--i:${i}">${w.replace(/\*/g,"")}</span>`:`<span style="--i:${i}">${w}</span>`).join(" ");

$("#app").innerHTML=`
<header class="hero" id="home">
  <div class="bg" id="bg"><img src="${F.backdrop}" alt="" onerror="this.remove()"></div>
  <div class="hero-in"><p class="pre">${F.pre}</p><h1 aria-label="${F.title}">${F.logotype?`<img class="logotype" src="${F.logotype}" alt="${F.title}">`:chars(F.title)}</h1>${F.tagline?`<p class="tl">${F.tagline}</p>`:""}</div>
  <div class="scroll" aria-hidden="true"></div>
</header>
${has.story?`<section id="story"><div class="wrap story"><div>
  <h2>Story</h2>${F.logline?`<p class="lg">${F.logline}</p>`:""}${(F.synopsis||[]).map(p=>`<p>${p}</p>`).join("")}
  <div class="meta">${meta.map(m=>`<span>${m[0]} <b>${m[1]}</b></span>`).join("")}</div></div>
  <div class="poster"><figure><div class="frame"><button class="card" data-lb aria-label="Open poster"><div class="ph"><b>Poster</b><span>${F.poster}</span></div><img src="${F.poster}" alt="Poster of ${F.title}" onerror="this.remove()"></button></div><figcaption class="lbl">Poster</figcaption></figure></div></div></section>`:""}
${has.Trailer?`<section id="Trailer"><div class="wrap"><h2>Trailer</h2>
  <div class="vgrid">${vids.map((v,i)=>`<figure><div class="player card" data-v="${i}"></div><figcaption class="lbl">${v.label}</figcaption></figure>`).join("")}</div></div></section>`:""}
${has.fest?`<section id="festivals"><div class="wrap"><h2>Festivals</h2><ul class="fest">${fests.map(x=>`<li class="${x.win?"win":""}"><span class="y">${x.year||""}</span><span class="n">${x.name}${x.city?`<small>${x.city}</small>`:""}</span><span class="r">${x.result||""}</span></li>`).join("")}</ul></div></section>`:""}
${has.gal?`<section id="gallery"><div class="wrap"><h2>Behind The Scenes</h2><div class="gal">${gal.map((g,i)=>`<button class="card" data-lb style="--i:${i%3}" aria-label="Open image ${i+1}"><div class="ph"><b>BTS ${String(i+1).padStart(2,"0")}</b><span>${g}</span></div><img loading="lazy" src="${g}" alt="${F.title} – behind the scenes ${i+1}" onerror="this.remove()"></button>`).join("")}</div></div></section>`:""}
${has.Crew?`<section id="Crew"><div class="wrap"><h2>Cast &amp; Crew</h2><div class="Crew">${Crew.map((c,i)=>`<article style="--i:${i%4}"><div class="av"><span>${ini(c[1])}</span><img loading="lazy" src="${c[2]||"assets/Crew/"+slug(c[1])+".jpg"}" alt="${c[1]}" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div><h4>${c[1]}</h4><p>${c[0]}</p></article>`).join("")}</div></div></section>`:""}
<section class="end" id="contact"><p class="tag" id="tag">${words(F.closing)}</p>
  <div class="social">${(F.contact||[]).map(c=>`<a href="${c[1]}"${c[1].startsWith("mailto:")?"":` target="_blank" rel="noopener"`} aria-label="${c[0]}">${ICON[c[2]]||""}<span class="social-label">${c[0]}</span></a>`).join("")}</div>
  <footer><small>A film by Ali Mehryar · Website designed by Ali Mehryar</small></footer></section>`;

const lg=$(".logotype");if(lg)lg.onerror=()=>{$(".hero h1").innerHTML=chars(F.title)};

/* video cards: cover first, player loads on click */
const embed=v=>v.type==="youtube"?`<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen title="${v.label}"></iframe>`
  :v.type==="vimeo"?`<iframe src="https://player.vimeo.com/video/${v.id}?${v.h?`h=${v.h}&`:""}autoplay=1" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay;fullscreen;picture-in-picture;clipboard-write;encrypted-media;web-share" allowfullscreen title="${v.label}"></iframe>`
  :`<video src="${v.src}" controls autoplay playsinline></video>`;
$$("[data-v]").forEach(box=>{
  const v=vids[+box.dataset.v],t=v.cover||(v.type==="youtube"&&v.id?`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`:"");
  box.innerHTML=`<button class="play" aria-label="Play ${v.label}"><div class="ph"><b>${v.label}</b><span>${v.cover||"cover image"}</span></div>${t?`<img src="${t}" alt="" onerror="this.remove()">`:""}<i></i></button>`;
  $(".play",box).onclick=()=>{if(v.id||v.src)box.innerHTML=embed(v)};
});

/* lightbox: poster + behind-the-scenes images that actually exist */
const lb=$("#lb"),li=$("img",lb);let k=0;
const imgs=()=>$$("[data-lb] img");
const open=i=>{const a=imgs();if(!a.length)return;k=(i+a.length)%a.length;li.src=a[k].src;lb.classList.add("on")};
$$("[data-lb]").forEach(b=>b.onclick=()=>{const im=$("img",b);if(im)open(imgs().indexOf(im))});
$(".x",lb).onclick=()=>lb.classList.remove("on");$(".p",lb).onclick=()=>open(k-1);$(".n",lb).onclick=()=>open(k+1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove("on")};
addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")open(k-1);if(e.key==="ArrowRight")open(k+1)});

/* motion: scroll reveals, sticky nav, progress bar, hero parallax, scroll spy */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
$$(".gal,.Crew article,#tag").forEach(el=>io.observe(el));
const navEl=$("#nav"),bar=$("#bar"),bg=$("#bg"),secs=$$("section,header"),lnk=$$(".links a:not(.cta)");let tick=false;
function onScroll(){
  const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  navEl.classList.toggle("solid",y>50);bar.style.transform=`scaleX(${h>0?y/h:0})`;
  if(y<innerHeight)bg.style.transform=`translateY(${y*.25}px)`;
  const cur=secs.filter(s=>s.getBoundingClientRect().top<innerHeight*.4).pop();
  lnk.forEach(a=>a.classList.toggle("on",cur&&a.hash==="#"+cur.id));tick=false}
addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});onScroll();
</script>
</body>
</html>
